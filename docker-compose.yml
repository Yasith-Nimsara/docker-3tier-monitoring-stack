services:
  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - public-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: app-frontend
    networks:
      - public-net
    restart: unless-stopped
  

  backend:
    build: ./backend             
    container_name: app-backend  
    environment:
      - MONGO_URI=mongodb://mongodb:27017/devopsdb 
    depends_on:
      - mongodb                 
    networks:
      - backend-net             
      - public-net
    restart: unless-stopped     


  mongodb:
    image: mongo:7               
    container_name: app-mongodb
    volumes:
      - mongo-data:/data/db      
    networks:
      - backend-net              
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: mon-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - monitoring-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: mon-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mon-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=devopsadmin
    volumes:
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net
    restart: unless-stopped

networks:
  backend-net:
    driver: bridge               
  public-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  mongo-data:                    
  grafana-data:
